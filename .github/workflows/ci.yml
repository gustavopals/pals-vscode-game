name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # No main nada é cancelado: um push mais novo não pode interromper um deploy pela metade.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GDD §14.14: dependências de produção auditadas; falha com vulnerabilidade alta ou crítica.
      - run: pnpm audit --prod --audit-level high
      - run: pnpm verify
      - run: pnpm build

  integration:
    name: integration (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lotg
          POSTGRES_PASSWORD: lotg
          POSTGRES_DB: lotg_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lotg -d lotg_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://lotg:lotg@localhost:5433/lotg_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: e2e (Chromium, app web + API + PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lotg
          POSTGRES_PASSWORD: lotg
          POSTGRES_DB: lotg_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lotg -d lotg_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://lotg:lotg@localhost:5433/lotg_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # As capturas dos três temas são para olhos humanos (docs/manual-test-v0.1.md).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  landing:
    name: landing (Chromium, página de apresentação)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Página estática: não precisa da API nem do banco.
      - run: pnpm test:e2e:landing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing
          path: |
            packages/landing/playwright-report/
            packages/landing/test-results/
          retention-days: 14

  docker:
    name: docker (alvos runtime, web e landing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile --target runtime -t lotg-api:ci .
      - run: docker build -f deploy/Dockerfile --target web -t lotg-web:ci .
      - run: docker build -f deploy/Dockerfile --target landing -t lotg-landing:ci .
      # A imagem da página responde: cabeçalhos de segurança, cache e a página de caminho errado.
      - run: |
          docker run --rm -d --name lotg-landing -p 8080:80 lotg-landing:ci
          scripts/landing-smoke.sh http://localhost:8080

  # Implantação automática (ADR 0009): só em push no main e só depois de todos os jobs acima
  # passarem. Chama a API do Coolify com um token que fica no segredo COOLIFY_DEPLOY_TOKEN
  # (permissões read e deploy). A API vai primeiro; o app só é trocado com ela saudável. A página
  # de apresentação (ADR 0012) vai por último: é independente do jogo e não o derruba.
  deploy:
    name: deploy (Coolify)
    needs: [verify, integration, e2e, landing, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Um deploy de cada vez, e nunca interrompido no meio por um push mais novo.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      COOLIFY_API: https://app.palsincomehub.com/api/v1
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
      PUBLIC_URL: https://lords.palsincomehub.com
      API_UUID: bkybag7rv7glgbh9zhv1ysu9
      WEB_UUID: mbixhquvhyrqhduh3bzgoho1
      LANDING_URL: https://lordsoftheguild.palsincomehub.com
      LANDING_UUID: d0eskxfxv0vp8x47yhbuvnyf
    steps:
      # Só para ter scripts/landing-smoke.sh; o que vai ao ar é o que o Coolify busca no main.
      - uses: actions/checkout@v4
      - name: Implantar a API, o app e a página de apresentação
        run: |
          set -euo pipefail
          coolify() { curl --silent --show-error --fail --max-time 30 -H "Authorization: Bearer $COOLIFY_TOKEN" "$@"; }

          deploy() {
            local name=$1 uuid=$2 id status
            id=$(coolify -X POST "$COOLIFY_API/deploy?uuid=$uuid" | jq -r '.deployments[0].deployment_uuid')
            echo "$name: deploy $id na fila"
            for _ in $(seq 1 90); do
              status=$(coolify "$COOLIFY_API/deployments/$id" | jq -r '.status')
              case "$status" in
                finished) echo "$name: implantado"; return 0 ;;
                failed | cancelled*) echo "::error::$name: o deploy terminou como $status"; return 1 ;;
              esac
              sleep 10
            done
            echo "::error::$name: o deploy não terminou em 15 minutos"
            return 1
          }

          healthy() {
            for _ in $(seq 1 30); do
              if [ "$(curl --silent --max-time 10 "$PUBLIC_URL/v1/health" | jq -r '.status + "/" + .db' 2>/dev/null)" = "ok/ok" ]; then
                return 0
              fi
              sleep 5
            done
            echo "::error::/v1/health não respondeu ok depois do deploy"
            return 1
          }

          deploy API "$API_UUID"
          healthy
          deploy app "$WEB_UUID"
          healthy
          curl --silent --show-error --fail --max-time 10 "$PUBLIC_URL/" | grep --quiet '<title>Lords of the Guild</title>'
          echo "No ar: $(curl --silent --max-time 10 "$PUBLIC_URL/v1/version")"

          deploy "página de apresentação" "$LANDING_UUID"
          scripts/landing-smoke.sh "$LANDING_URL"
