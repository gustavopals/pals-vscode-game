name: Saúde da produção

# Monitor externo da API (MVP-ROADMAP.md F4-T4): consulta /v1/health e a página do app de fora
# do servidor. Quando falha, o GitHub avisa por e-mail quem tem as notificações de Actions ligadas
# para o repositório. O agendamento do GitHub não é pontual: o intervalo real fica entre 5 e 15
# minutos, e ele é suspenso depois de 60 dias sem commits no repositório.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: health
  cancel-in-progress: true

env:
  PUBLIC_URL: https://lords.palsincomehub.com

jobs:
  health:
    name: /v1/health e app
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: API responde e fala com o banco
        run: |
          body=$(curl --silent --show-error --fail --max-time 10 --retry 2 --retry-delay 10 --retry-all-errors "$PUBLIC_URL/v1/health")
          echo "$body"
          test "$(echo "$body" | jq -r '.status + "/" + .db')" = "ok/ok"
      - name: App web é entregue
        run: |
          curl --silent --show-error --fail --max-time 10 --retry 2 --retry-delay 10 --retry-all-errors "$PUBLIC_URL/" \
            | grep --quiet '<title>Lords of the Guild</title>'
