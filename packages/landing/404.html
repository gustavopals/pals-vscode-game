<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A mesma política de conteúdo da página principal. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Lords of the Guild: este caminho não leva a Pedra Alta</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <header class="masthead">
      <p class="brand">
        <img src="/favicon.svg" alt="" width="36" height="36" />
        Lords of the Guild
      </p>
    </header>

    <main class="lost">
      <h1>
        <span class="voice-office">Erro 404.</span>
        <span class="voice-fief">Este caminho não leva a Pedra Alta.</span>
      </h1>
      <p class="lede">O endereço que você abriu não existe nesta página.</p>
      <a class="cta" href="/">Voltar ao começo</a>
    </main>

    <aside class="statusbar" aria-label="Atalho para o jogo">
      <p class="statusbar-name">
        <img src="/favicon.svg" alt="" width="16" height="16" />
        Lords of the Guild
      </p>
      <p class="statusbar-note"></p>
      <a class="statusbar-cta" href="%GAME_URL%">Jogar agora</a>
    </aside>
  </body>
</html>
